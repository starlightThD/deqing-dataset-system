[project]
name = "deqing-dataset-system"
version = "0.1.0"
description = "Versioned garden dataset service"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "psycopg[binary]>=3.2,<4",
  "pyproj>=3.6,<4",
  "pyshp>=2.3,<4",
  "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1", "pytest>=8,<10"]

[project.scripts]
deqing-data = "dataset_service.main:run"
deqing-data-credentials = "dataset_service.credentials:main"
deqing-data-legacy-auth = "dataset_service.legacy_auth:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dataset_service*"]

[tool.setuptools.package-data]
dataset_service = ["static/management/*"]
